<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WisdomScroll — Every tradition. One scroll.</title>
<meta name="description" content="Scroll scripture and wisdom from Christianity, Islam, Hinduism, Buddhism, Judaism, Sikhism and Taoism in one calm feed.">
<style>
:root{--bg:#fbfaf8;--ink:#171513;--muted:#746f69;--line:#e9e4de;--accent:#7b43bd;--soft:#f2ecf8}
*{box-sizing:border-box}html,body{margin:0;background:#eceae7;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input{font:inherit}.app{width:min(430px,100%);min-height:100dvh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;min-height:100dvh;padding-bottom:78px}.screen.active{display:block}
.top{position:sticky;top:0;z-index:8;height:62px;display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fbfaf8e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700;font-size:13px}.grow{flex:1}
.feed{height:calc(100dvh - 78px);overflow:auto;scroll-snap-type:y mandatory}
.card{height:calc(100dvh - 78px);scroll-snap-align:start;position:relative;display:flex;align-items:center;padding:90px 68px 116px 44px;background:#fff}
.rail{position:absolute;left:17px;top:105px;display:flex;flex-direction:column;gap:7px}.rail i{width:4px;height:25px;border-radius:9px;background:#ddd7d1}.rail i.on{background:var(--accent)}
.seal{position:absolute;top:91px;left:50%;transform:translateX(-50%);font-size:42px}.tag{display:inline-block;background:#f7efe4;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;margin-bottom:23px}
.verse{font:400 31px/1.28 Georgia,serif;letter-spacing:-.02em;margin:0}.ref{font:700 16px Georgia,serif;margin:23px 0 5px}.lang{font-size:12px;color:var(--muted)}
.actions{position:absolute;right:11px;bottom:120px;display:flex;flex-direction:column;gap:15px}.actions button{width:50px;border:0;background:transparent;font-size:24px}.actions small{display:block;font-size:9px;margin-top:2px}
.hint{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);text-align:center;color:var(--muted);font-size:11px}
.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:78px;background:#fffc;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.nav{border:0;background:transparent;font-size:11px;color:#4c4844}.nav b{display:block;font-size:20px;font-weight:500;margin-bottom:2px}.nav.active{color:var(--accent);font-weight:800}
.hero{padding:30px 22px 35px;background:linear-gradient(180deg,#fff,#fff6ec 70%,#efe5f6);border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:21px}.hero h1{font:700 45px/.96 Georgia,serif;letter-spacing:-.04em;text-align:center;margin:44px 0 14px}.hero p{text-align:center;color:#5f5a55;line-height:1.5}
.list,.results{padding:14px}.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px;margin-bottom:9px}.mark{width:44px;height:44px;border-radius:13px;background:#f7efe4;display:grid;place-items:center;font-size:24px}.copy{flex:1}.copy b{display:block}.copy span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.title{font:700 28px Georgia,serif;padding:20px 16px 6px}
.searchbox{display:flex;gap:8px;margin:14px;background:#eee9e4;border-radius:14px;padding:10px 12px}.searchbox input{border:0;outline:0;background:transparent;width:100%}
.sheetbg{position:fixed;z-index:30;inset:0;background:#0005;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(430px,100%);max-height:78dvh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:12px 18px 28px}.handle{width:42px;height:4px;border-radius:9px;background:#d7d2cc;margin:0 auto 18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:24px}
.option{width:100%;border:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:15px 4px;text-align:left}.option .left{width:36px;font-size:23px}.option .g{flex:1}.option span{display:block;color:var(--muted);font-size:12px}.check{color:var(--accent);font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#f0ece7;border-radius:11px;padding:3px;margin:18px 0}.tab{border:0;background:transparent;padding:8px;border-radius:8px}.tab.on{background:var(--accent);color:#fff}.study h2{font:700 29px Georgia,serif}.study p{line-height:1.55}.tags{display:flex;gap:7px;flex-wrap:wrap}.tags span{background:var(--soft);color:#68408f;padding:7px 10px;border-radius:999px;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:70px 25px}.toast{position:fixed;z-index:50;bottom:92px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px}
@media(min-width:700px){body{padding:18px}.app{border-radius:28px}.bottom{bottom:18px;border-radius:0 0 28px 28px}.feed,.card{height:calc(100dvh - 114px)}}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="top"><button id="filter" class="pill">All Traditions⌄</button><div class="grow"></div><button id="language" class="pill">English⌄</button><button id="shuffle" class="pill">↝</button></div><main id="feed" class="feed"></main></section>
<section id="discover" class="screen"><div class="hero"><div class="brand">✦ WisdomScroll</div><h1>Every tradition.<br>One scroll.</h1><p>Explore wisdom from the world's great scriptures while keeping every source clearly identified.</p></div><h2 class="title">Discover</h2><div id="discoverList" class="list"></div></section>
<section id="search" class="screen"><div class="top"><strong style="font-size:20px">Search</strong></div><div class="searchbox">⌕ <input id="q" placeholder="Search peace, duty, grief…"></div><div id="results" class="results"></div></section>
<section id="saved" class="screen"><div class="top"><strong style="font-size:20px">Saved</strong></div><div id="savedList" class="list"></div></section>
<nav class="bottom"><button class="nav active" data-id="home"><b>⌂</b>Home</button><button class="nav" data-id="discover"><b>◈</b>Discover</button><button class="nav" data-id="search"><b>⌕</b>Search</button><button class="nav" data-id="saved"><b>▱</b>Saved</button></nav>
</div><div id="modal"></div><script>
const T=[['christianity','Bible','Christianity','✝',['English','Español','हिन्दी']],['islam',"Qur’an",'Islam','☾',['English','العربية','اردو','हिन्दी']],['hinduism','Bhagavad Gita','Hinduism','ॐ',['English','हिन्दी','संस्कृत']],['buddhism','Dhammapada','Buddhism','☸',['English','Pāli','हिन्दी']],['judaism','Tanakh','Judaism','✡',['English','עברית']],['sikhism','Guru Granth Sahib','Sikhism','ੴ',['English','ਪੰਜਾਬੀ','हिन्दी']],['taoism','Tao Te Ching','Taoism','☯',['English','中文']]].map(x=>({slug:x[0],name:x[1],faith:x[2],mark:x[3],langs:x[4]}));
const P=[
{id:1,s:'hinduism',r:'Bhagavad Gita 2:47',English:'You have a right to action alone, not to its fruits. Do not be attached to the results of your actions, nor be inactive out of fear of failure.','हिन्दी':'तुम्हारा अधिकार केवल कर्म करने में है, उसके फलों में कभी नहीं।','संस्कृत':'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन। मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥',topics:['duty','purpose'],ctx:'Krishna teaches Arjuna to focus on right action rather than attachment to outcomes.'},
{id:2,s:'islam',r:"Qur’an 94:5",English:'Indeed, with hardship comes ease.','العربية':'فَإِنَّ مَعَ الْعُسْرِ يُسْرًا','اردو':'پس بے شک مشکل کے ساتھ آسانی ہے۔','हिन्दी':'निस्संदेह कठिनाई के साथ आसानी है।',topics:['hope','grief'],ctx:'A short assurance from Surat Ash-Sharh that hardship is accompanied by relief.'},
{id:3,s:'christianity',r:'Matthew 5:9',English:'Blessed are the peacemakers: for they shall be called the children of God.','Español':'Bienaventurados los pacificadores, porque ellos serán llamados hijos de Dios.','हिन्दी':'धन्य हैं वे जो मेल कराते हैं, क्योंकि वे परमेश्वर के पुत्र कहलाएँगे।',topics:['peace','forgiveness'],ctx:'From the Beatitudes in the Sermon on the Mount.'},
{id:4,s:'buddhism',r:'Dhammapada 5',English:'Hatred does not cease by hatred at any time; hatred ceases by love.','Pāli':'Na hi verena verāni sammantīdha kudācanaṃ; averena ca sammanti.','हिन्दी':'घृणा से घृणा कभी समाप्त नहीं होती; प्रेम से ही समाप्त होती है।',topics:['peace','love'],ctx:'A teaching on breaking cycles of hostility through non-hatred.'},
{id:5,s:'judaism',r:'Micah 6:8',English:'Do justly, love mercy, and walk humbly with your God.','עברית':'עֲשׂוֹת מִשְׁפָּט וְאַהֲבַת חֶסֶד וְהַצְנֵעַ לֶכֶת עִם־אֱלֹהֶיךָ',topics:['justice','mercy'],ctx:'Micah condenses religious duty into justice, mercy, and humility.'},
{id:6,s:'sikhism',r:'Guru Granth Sahib · Mool Mantar',English:'There is One Creator, whose name is Truth, without fear, without hate.','ਪੰਜਾਬੀ':'ੴ ਸਤਿ ਨਾਮੁ ਕਰਤਾ ਪੁਰਖੁ ਨਿਰਭਉ ਨਿਰਵੈਰੁ','हिन्दी':'एक परम सत्य है; उसका नाम सत्य है, वह सृष्टिकर्ता है, निर्भय और निर्वैर है।',topics:['truth','purpose'],ctx:'The opening creed describes the oneness and attributes of the Divine.'},
{id:7,s:'taoism',r:'Tao Te Ching 8',English:'The highest goodness is like water. Water benefits all things and does not compete.','中文':'上善若水。水善利萬物而不爭。',topics:['humility','peace'],ctx:'Water is used as an image for benefiting others without striving for status.'},
{id:8,s:'christianity',r:'Psalm 23:1',English:'The LORD is my shepherd; I shall not want.','Español':'Jehová es mi pastor; nada me faltará.','हिन्दी':'प्रभु मेरा चरवाहा है; मुझे किसी बात की कमी न होगी।',topics:['comfort','grief'],ctx:'A psalm of trust that pictures God as a shepherd.'},
{id:9,s:'islam',r:"Qur’an 49:13",English:'We made you peoples and tribes so that you may know one another.','العربية':'وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا','اردو':'اور ہم نے تمہیں قوموں اور قبیلوں میں بنایا تاکہ تم ایک دوسرے کو پہچانو۔','हिन्दी':'हमने तुम्हें जातियों और क़बीलों में बनाया ताकि तुम एक-दूसरे को पहचानो।',topics:['community','purpose'],ctx:'A passage framing human diversity as a basis for mutual recognition.'}
];
let filter='all',langs=JSON.parse(localStorage.getItem('ws-langs')||'{}'),saved=JSON.parse(localStorage.getItem('ws-saved')||'[]');
const tr=s=>T.find(t=>t.slug===s),arr=()=>filter==='all'?P:P.filter(p=>p.s===filter),text=p=>p[langs[p.s]||'English']||p.English;
function render(){const a=arr();feed.innerHTML=a.map((p,i)=>{const t=tr(p.s),l=langs[p.s]||'English',rtl=['العربية','اردو','עברית'].includes(l);return '<section class="card" data-id="'+p.id+'"><div class="rail">'+a.slice(0,5).map((_,x)=>'<i class="'+(x===Math.min(i,4)?'on':'')+'"></i>').join('')+'</div><div class="seal">'+t.mark+'</div><div dir="'+(rtl?'rtl':'ltr')+'"><span class="tag">'+t.name+' · '+t.faith+'</span><p class="verse">'+text(p)+'</p><p class="ref">'+p.r+'</p><p class="lang">'+l+'</p></div><div class="actions"><button onclick="save('+p.id+')">'+(saved.includes(p.id)?'♥':'♡')+'<small>Save</small></button><button onclick="study('+p.id+')">▣<small>Study</small></button><button onclick="shareP('+p.id+')">↥<small>Share</small></button><button onclick="listen('+p.id+')">◖<small>Listen</small></button></div><div class="hint">⌃<br>Swipe up for next</div></section>'}).join('');filterBtn();renderSaved()}
function filterBtn(){document.getElementById('filter').textContent=(filter==='all'?'All Traditions':tr(filter).name)+'⌄';let f=arr()[0];document.getElementById('language').textContent=(f?(langs[f.s]||'English'):'English')+'⌄'}
function modal(x){document.getElementById('modal').innerHTML='<div class="sheetbg" onclick="closeM()"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div>'+x+'</div></div>'}function closeM(){document.getElementById('modal').innerHTML=''}
document.getElementById('filter').onclick=()=>modal('<div class="sheethead"><h2>Choose Scriptures</h2><button class="close" onclick="closeM()">×</button></div>'+[{slug:'all',name:'All Traditions',faith:'Mixed',mark:'∞'},...T].map(x=>'<button class="option" onclick="setF(\''+x.slug+'\')"><div class="left">'+x.mark+'</div><div class="g"><b>'+x.name+'</b><span>'+x.faith+'</span></div><div class="check">'+(filter===x.slug?'✓':'')+'</div></button>').join(''));
function setF(s){filter=s;closeM();render()}
document.getElementById('language').onclick=()=>{let p=arr()[0];if(!p)return;let t=tr(p.s),cur=langs[p.s]||'English';modal('<div class="sheethead"><h2>Select Language</h2><button class="close" onclick="closeM()">×</button></div><div style="padding:7px 4px;font-weight:800">'+t.name+'</div>'+t.langs.map(l=>'<button class="option" onclick="setL(\''+p.s+'\',\''+l+'\')"><div class="g"><b>'+l+(l==='English'?' (Default)':'')+'</b></div><div class="check">'+(cur===l?'●':'○')+'</div></button>').join(''))}
function setL(s,l){langs[s]=l;localStorage.setItem('ws-langs',JSON.stringify(langs));closeM();render();toast('Language: '+l)}
document.getElementById('shuffle').onclick=()=>{P.sort(()=>Math.random()-.5);render();toast('Feed reshuffled')}
function save(id){saved=saved.includes(id)?saved.filter(x=>x!==id):saved.concat(id);localStorage.setItem('ws-saved',JSON.stringify(saved));render();toast(saved.includes(id)?'Saved':'Removed')}
function study(id){let p=P.find(x=>x.id===id),t=tr(p.s);modal('<div class="study"><div class="sheethead"><div><b>'+p.r+'</b><div style="font-size:12px;color:#777">'+t.faith+'</div></div><button class="close" onclick="closeM()">×</button></div><div class="tabs"><button class="tab on">Meaning</button><button class="tab">Context</button><button class="tab">About</button></div><h2>Meaning</h2><p>'+p.ctx+'</p><div class="tags">'+p.topics.map(x=>'<span>'+x+'</span>').join('')+'</div></div>')}
function listen(id){let p=P.find(x=>x.id===id);if(!('speechSynthesis'in window)){toast('Listen unavailable');return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text(p)));toast('Playing passage')}
async function shareP(id){let p=P.find(x=>x.id===id),v=text(p)+' — '+p.r;try{if(navigator.share)await navigator.share({title:p.r,text:v});else{await navigator.clipboard.writeText(v);toast('Copied')}}catch{}}
function toast(m){let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.id===id))}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>screen(b.dataset.id));
discoverList.innerHTML='<div class="row" onclick="choose(\'all\')"><div class="mark">∞</div><div class="copy"><b>All Scriptures (Mixed)</b><span>A shared stream from every tradition</span></div>›</div>'+T.map(t=>'<div class="row" onclick="choose(\''+t.slug+'\')"><div class="mark">'+t.mark+'</div><div class="copy"><b>'+t.name+'</b><span>'+t.faith+'</span></div>›</div>').join('');
function choose(s){filter=s;screen('home');render()}
q.oninput=e=>search(e.target.value);function search(v){v=v.toLowerCase();let a=P.filter(p=>!v||p.r.toLowerCase().includes(v)||p.English.toLowerCase().includes(v)||p.topics.some(x=>x.includes(v))||Object.values(p).some(x=>typeof x==='string'&&x.toLowerCase().includes(v)));results.innerHTML=a.length?a.map(p=>'<div class="row" onclick="jump('+p.id+')"><div class="mark">'+tr(p.s).mark+'</div><div class="copy"><b>'+p.r+'</b><span>'+text(p).slice(0,85)+'…</span></div>›</div>').join(''):'<div class="empty">No matching passages.</div>'}
function jump(id){filter='all';screen('home');render();setTimeout(()=>document.querySelector('[data-id="'+id+'"]')?.scrollIntoView(),20)}
function renderSaved(){let a=P.filter(p=>saved.includes(p.id));savedList.innerHTML=a.length?a.map(p=>'<div class="row" onclick="jump('+p.id+')"><div class="mark">'+tr(p.s).mark+'</div><div class="copy"><b>'+p.r+'</b><span>'+text(p).slice(0,85)+'…</span></div>›</div>').join(''):'<div class="empty">Save passages from the feed and they will appear here.</div>'}
render();search('');
</script></body></html>
